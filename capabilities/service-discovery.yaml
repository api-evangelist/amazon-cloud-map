naftiko: "1.0.0-alpha1"

info:
  label: "Amazon Cloud Map Service Discovery"
  description: "Workflow for dynamically discovering and registering microservices using AWS Cloud Map, enabling DevOps and platform engineers to maintain service registries with health-based routing."
  tags:
    - Amazon Web Services
    - Cloud Map
    - Service Discovery
    - Microservices
    - DevOps
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - import: cloudmap
      location: ./shared/cloud-map.yaml

  exposes:
    - type: rest
      port: 8080
      namespace: service-discovery-api
      description: "Unified REST API for AWS Cloud Map service discovery operations."
      resources:
        - path: /v1/namespaces
          name: namespaces
          description: "Manage service discovery namespaces"
          operations:
            - method: GET
              name: list-namespaces
              description: "List all namespaces"
              call: "cloudmap.list-namespaces"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/services
          name: services
          description: "Manage services"
          operations:
            - method: GET
              name: list-services
              description: "List services"
              call: "cloudmap.list-services"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-service
              description: "Create a service"
              call: "cloudmap.create-service"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/discover
          name: discover
          description: "Discover service instances"
          operations:
            - method: POST
              name: discover-instances
              description: "Discover healthy instances"
              call: "cloudmap.discover-instances"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9090
      namespace: service-discovery-mcp
      transport: http
      description: "MCP server for AI-assisted service discovery using AWS Cloud Map."
      tools:
        - name: list-namespaces
          description: "List all Cloud Map service discovery namespaces"
          hints:
            readOnly: true
            idempotent: true
          call: "cloudmap.list-namespaces"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-services
          description: "List services registered in Cloud Map"
          hints:
            readOnly: true
            idempotent: true
          call: "cloudmap.list-services"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-service
          description: "Create a new Cloud Map service within a namespace"
          hints:
            readOnly: false
            idempotent: false
          call: "cloudmap.create-service"
          with:
            Name: "tools.name"
            NamespaceId: "tools.namespace_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: discover-instances
          description: "Discover healthy service instances by namespace and service name"
          hints:
            readOnly: true
            idempotent: true
          call: "cloudmap.discover-instances"
          with:
            NamespaceName: "tools.namespace_name"
            ServiceName: "tools.service_name"
          outputParameters:
            - type: object
              mapping: "$."
        - name: register-instance
          description: "Register an instance with a Cloud Map service"
          hints:
            readOnly: false
            idempotent: false
          call: "cloudmap.register-instance"
          with:
            ServiceId: "tools.service_id"
            InstanceId: "tools.instance_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-instances
          description: "List all instances registered with a specific Cloud Map service"
          hints:
            readOnly: true
            idempotent: true
          call: "cloudmap.list-instances"
          with:
            ServiceId: "tools.service_id"
          outputParameters:
            - type: object
              mapping: "$."
