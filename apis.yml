aid: amazon-cloud-map
name: Amazon Cloud Map
description: >-
  Amazon Cloud Map is a cloud resource discovery service that maintains an updated registry of application resources and
  their locations. Define custom names for application resources and use Cloud Map to dynamically discover service
  dependencies with integrated health checking and automatic updates.
